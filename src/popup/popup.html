<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Proper Fullscreen</title>
</head>
<body>
  <header>
    <span class="site" id="site">…</span>
    <span class="badge" id="badge">—</span>
  </header>
  <main>
    <div class="row">
      <span class="stat" id="stat">—</span>
      <label class="switch"><input type="checkbox" id="enabled" checked> Enabled</label>
    </div>
    <hr>
    <fieldset id="presets"></fieldset>
    <div class="custom">
      <input type="text" id="customAR" placeholder="Custom — e.g. 2.39 or 21:9" aria-label="Custom aspect ratio">
      <button id="applyCustom">Set</button>
    </div>
    <hr>
    <div class="row">
      <button id="detect" class="primary">Auto-detect from video</button>
    </div>
    <div class="msg" id="msg"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
