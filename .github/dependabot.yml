version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR per ecosystem rather than one per package — everything here is a dev dependency
    # and they are verified together by CI anyway.
    groups:
      dev-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
